services:
  - type: web
    name: almomiaa-erp-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: apps/backend-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Hosting__TrustForwardedHeaders
        value: "true"
      - key: Swagger__Enabled
        value: "true"
      - key: Redis__AllowInMemoryFallback
        value: "true"
      - key: Database__AutoMigrateOnStartup
        value: "true"
      - key: Demo__SeedEnabled
        value: "true"
      - key: Auth__Jwt__Audience
        value: almomiaa-erp-clients
      - key: Auth__Jwt__Issuer
        sync: false
      - key: Auth__Jwt__SigningKey
        generateValue: true
      - key: ConnectionStrings__SqlServer
        sync: false
      - key: Cors__AllowedOriginsCsv
        sync: false
      - key: Demo__DefaultPassword
        sync: false
